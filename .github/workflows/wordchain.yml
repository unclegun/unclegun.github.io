name: WordChain CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wordchain.yml'
      - 'games/wordchain/**'

permissions:
  contents: read

jobs:
  test:
    name: Test and browser smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        uses: browser-actions/setup-chrome@v1
      - name: Run WordChain tests
        working-directory: games/wordchain
        env:
          CHROME_BIN: google-chrome
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/wordchain-test-output.txt
          {
            echo '## WordChain test summary'
            echo '```text'
            tail -n 18 /tmp/wordchain-test-output.txt
            echo '```'
            if grep -q '# SKIP no Chromium available' /tmp/wordchain-test-output.txt; then
              echo 'Browser smoke tests: **skipped** (Chromium was unavailable).'
            else
              echo 'Browser smoke tests: **executed** by the existing headless Chromium test.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
